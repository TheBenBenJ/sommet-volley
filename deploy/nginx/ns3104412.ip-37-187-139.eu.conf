# Vhost partagé : blobby-volley (racine) + sommet-volley (/sommet-volley/) + matchmaker (/mm).
# Géré par deploy/apply-infra.sh (CI). Ne pas éditer à la main sur le serveur sans sync repo.
# Certbot gère les blocs listen/ssl — les regenerer si besoin : certbot --nginx -d <host>

server {
    server_name ns3104412.ip-37-187-139.eu;

    root /var/www/blobby-volley;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /sommet-volley {
        return 301 /sommet-volley/;
    }

    location /sommet-volley/ {
        alias /var/www/sommet-volley/;
        index index.html;
    }

    location /mm {
        proxy_pass http://127.0.0.1:8787/mm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location = /mm/turn {
        proxy_pass http://127.0.0.1:8787/turn;
    }

    location = /mm/health {
        proxy_pass http://127.0.0.1:8787/health;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ns3104412.ip-37-187-139.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ns3104412.ip-37-187-139.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ns3104412.ip-37-187-139.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ns3104412.ip-37-187-139.eu;
    return 404; # managed by Certbot
}
